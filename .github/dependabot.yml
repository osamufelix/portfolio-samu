version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    ignore:
      # @astrojs/check só aceita typescript ^5 || ^6; remover quando suportar a 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
